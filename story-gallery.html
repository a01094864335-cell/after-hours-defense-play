<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마왕성 야간 일지 · 삽화 도감</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191121;color:#f5e8d6;font-family:system-ui,sans-serif}header{padding:28px 5vw;background:#2c1c35;border-bottom:1px solid #614462}h1{font-size:26px;margin:8px 0}header p{color:#ccb5ce;line-height:1.6}a{color:#f4c979}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center}select{background:#38283f;color:#ffe8c4;padding:10px;border:1px solid #87678c;border-radius:8px;max-width:100%}main{padding:12px 5vw 60px}section{padding:20px 0}h2{font-size:21px}section>div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}figure{margin:0;background:#2c1e35;border:1px solid #513959;border-radius:12px;overflow:hidden}img{display:block;width:100%;aspect-ratio:9/16;object-fit:contain;background:#160e1b;cursor:zoom-in}figcaption{padding:14px;line-height:1.6;font-size:13px}b{display:block;color:#f5cb88;font-size:14px}small{color:#baa6c4}dialog{border:0;padding:0;background:#160e1b;color:white;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh}dialog::backdrop{background:#000c}dialog img{height:calc(100dvh - 110px);width:100%;object-fit:contain;cursor:default}dialog footer{height:110px;display:grid;grid-template-columns:50px 1fr 50px;align-items:center;gap:12px;padding:12px}button{border:1px solid #806381;background:#39253e;color:white;min-width:44px;min-height:44px;border-radius:8px;cursor:pointer}#close{position:absolute;right:12px;top:12px}#caption{font-size:13px;text-align:center;line-height:1.5}@media(max-width:900px){section>div{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){main{padding:12px}section>div{gap:8px}figcaption{padding:10px;font-size:12px}h1{font-size:22px}}
</style>
<header><small>마왕이 퇴근한 뒤</small><h1>마왕성 야간 일지 · 삽화 도감</h1><p>첫 당직과 마왕성의 소소한 밤들. 20편 · 80장<br>그림을 누르면 한 장씩 크게 볼 수 있어요.</p><nav><select id="filter" aria-label="이야기 선택"><option value="">모든 이야기</option></select><a href="index.html">게임으로 돌아가기 →</a></nav></header>
<main id="gallery"></main>
<dialog id="viewer" aria-label="삽화 크게 보기"><button id="close" aria-label="닫기">✕</button><img id="large" alt=""><footer><button id="prev" aria-label="이전 그림">←</button><div id="caption"></div><button id="next" aria-label="다음 그림">→</button></footer></dialog>
<script src="castle-stories.js"></script>
<script>
const originalFiles=['01-first-shift','02-invasion','03-emergency-staff','04-night-duty'];
const originalTitles=['첫 당직','별일이 생겼다','긴급 파견','오늘 밤의 책임자'];
const all=[];let current=0;const viewer=document.querySelector('#viewer');
for(const [i,s] of CastleStories.entries()){
 const section=document.createElement('section');section.dataset.id=s.id;
 const heading=document.createElement('h2');heading.textContent=String(i+1).padStart(2,'0')+'. '+s.title;section.append(heading);
 const row=document.createElement('div');section.append(row);
 const option=document.createElement('option');option.value=s.id;option.textContent=heading.textContent;document.querySelector('#filter').append(option);
 for(let n=0;n<4;n++){
  const panel=s.original?[originalTitles[n],'','','']:s.panels[n];
  const src=s.original?'assets/comic/'+originalFiles[n]+'.webp':'assets/castle-stories/'+s.id+'/'+String(n+1).padStart(2,'0')+'.webp';
  const entry={src,title:s.title+' · '+(n+1)+'/4',panel};const index=all.push(entry)-1;
  const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption'),b=document.createElement('b'),line=document.createElement('p'),aside=document.createElement('small');
  img.src=src;img.alt=panel[0];img.loading='lazy';img.decoding='async';img.tabIndex=0;img.setAttribute('role','button');
  img.onclick=()=>{current=index;show();viewer.showModal()};img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();img.click()}};
  b.textContent=(n+1)+'. '+panel[0];line.textContent=panel[1]?panel[1]+': “'+panel[2]+'”':'';aside.textContent=panel[3]||'';
  caption.append(b,line,aside);figure.append(img,caption);row.append(figure);
 }
 document.querySelector('#gallery').append(section);
}
function show(){const a=all[current];document.querySelector('#large').src=a.src;document.querySelector('#large').alt=a.panel[0];document.querySelector('#caption').textContent=a.title+' · '+a.panel[0];document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===all.length-1}
document.querySelector('#close').onclick=()=>viewer.close();
document.querySelector('#prev').onclick=()=>{if(current>0){current--;show()}};
document.querySelector('#next').onclick=()=>{if(current<all.length-1){current++;show()}};
viewer.onkeydown=e=>{if(e.key==='ArrowLeft')document.querySelector('#prev').click();if(e.key==='ArrowRight')document.querySelector('#next').click()};
document.querySelector('#filter').onchange=e=>{for(const s of document.querySelectorAll('main section'))s.hidden=Boolean(e.target.value&&s.dataset.id!==e.target.value)};
</script></html>
