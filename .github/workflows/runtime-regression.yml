name: Validate and deploy game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_baseline:
        description: 'Recapture the pinned reference baseline (normally reuse the first audit artifact)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: game-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - run: node scripts/build-pages.cjs /tmp/game-pages
        if: always()
      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-browser.txt
        if: always()
      - run: python -m playwright install --with-deps chromium webkit
        if: always()
      - name: Capture baseline modal inventory
        if: always() && ((github.event_name == 'pull_request' && github.event.action == 'opened') || (github.event_name == 'workflow_dispatch' && inputs.capture_baseline))
        continue-on-error: true
        env:
          # Keep comparisons stable across subsequent PR revisions.
          BASE_SHA: '019694d6e5bc7fa2789e12a635f4416189586b11'
          UI_GAME_ROOT: /tmp/modal-baseline-pages
          UI_CHROMIUM_PATH: ''
          MODAL_QA_DIR: /tmp/modal-qa/baseline
          MODAL_QA_REPORT_ONLY: '1'
        run: |
          mkdir -p /tmp/modal-qa/baseline
          printf '%s\n' "$BASE_SHA" > /tmp/modal-qa/baseline/source-commit.txt
          trap 'echo "Baseline capture failed; inspect job logs." > /tmp/modal-qa/baseline/FAILED.txt' ERR
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'No verified baseline commit available for this event.' > /tmp/modal-qa/baseline/UNAVAILABLE.txt
            exit 0
          fi
          git worktree add --detach /tmp/modal-baseline-source "$BASE_SHA"
          (cd /tmp/modal-baseline-source && GITHUB_SHA="$BASE_SHA" node scripts/build-pages.cjs /tmp/modal-baseline-pages)
          python -m unittest discover -s tests -p 'test_modal_inventory.py' -v
      - name: Capture candidate modal inventory
        if: always()
        env:
          UI_GAME_ROOT: /tmp/game-pages
          UI_CHROMIUM_PATH: ''
          MODAL_QA_DIR: /tmp/modal-qa/candidate
          MODAL_QA_WEBKIT: '1'
        run: |
          mkdir -p "$MODAL_QA_DIR"
          git rev-parse HEAD > "$MODAL_QA_DIR/source-commit.txt"
          printf '%s\n' '019694d6e5bc7fa2789e12a635f4416189586b11' > "$MODAL_QA_DIR/reference-baseline-commit.txt"
          python -m unittest discover -s tests -p 'test_modal_inventory.py' -v
      - name: Upload modal screenshots and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-inventory-${{ github.run_id }}
          path: /tmp/modal-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Browser smoke on the packaged game
        if: always()
        run: |
          python -m unittest discover -s tests -p 'test_browser_smoke.py' -v
          python -m unittest discover -s tests -p 'test_shared_chrome.py' -v
          python -m unittest discover -s tests -p 'test_training_page.py' -v
          python -m unittest discover -s tests -p 'test_staff_outline_masks.py' -v
        env:
          UI_GAME_ROOT: /tmp/game-pages
          UI_CHROMIUM_PATH: ''
          OUTLINE_QA_DIR: /tmp/outline-qa
      - name: Upload staff outline browser galleries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-outlines-${{ github.run_id }}
          path: /tmp/outline-qa
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: /tmp/game-pages
  feature-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-pages.cjs /tmp/feature-game-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Repeat every browser regression independently
        env:
          UI_GAME_ROOT: /tmp/feature-game-pages
          UI_CHROMIUM_PATH: ''
          FEATURE_QA_DIR: /tmp/feature-qa
          FEATURE_QA_SHARD: ${{ matrix.shard }}
        run: python tests/run_feature_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-qa-${{ github.run_id }}-${{ matrix.shard }}
          path: /tmp/feature-qa
          if-no-files-found: warn
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [runtime, feature-qa]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
