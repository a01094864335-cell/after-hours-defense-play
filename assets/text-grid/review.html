<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>한글·영문 후보 UI 여백 검수</title><style>body{margin:0;padding:24px;background:#10254b;color:#fff6df;font:15px/1.6 system-ui,sans-serif}h1{font-size:25px}a{color:#ffdf57}header{max-width:1000px}label{margin-right:16px}select,button{padding:8px;margin:4px;border-radius:8px}main{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}figure{margin:0;width:250px}img{width:100%;height:auto;display:block;border-radius:8px}figcaption{padding:8px 0;overflow-wrap:anywhere}small{display:block;color:#c5d5f5}</style><header><h1>한글·영문 후보 UI 여백 검수</h1><p>주요 6화면 실제 캡처. 영문은 UI 번역 후보·레이아웃 검수이며 출시된 영문판이 아닙니다. 일부 본문과 원화의 한글은 정식 번역/애셋 교체 후 재검수가 필요합니다.</p><p><a href="../../">게임 열기</a> · <a href="https://github.com/a01094864335-cell/after-hours-defense-play/blob/main/docs/text-grid-audit-20261111.md">전체 화면 발견·수정 문서</a></p><label>언어 <select id="lang"><option value="ko">한국어</option><option value="en">English copy proposals</option></select></label><label>위치 <select id="position"><option value="top">상단</option><option value="bottom">하단</option></select></label></header><main></main><script>const data=[{"id": "lobby", "label": "메인", "lang": "ko", "src": "preview-lobby-ko.webp", "bottom": null}, {"id": "lobby", "label": "메인", "lang": "en", "src": "preview-lobby-en.webp", "bottom": null}, {"id": "roster", "label": "직원 도감", "lang": "ko", "src": "preview-roster-ko.webp", "bottom": "preview-roster-ko-bottom.webp"}, {"id": "roster", "label": "직원 도감", "lang": "en", "src": "preview-roster-en.webp", "bottom": "preview-roster-en-bottom.webp"}, {"id": "shop-pack", "label": "상점", "lang": "ko", "src": "preview-shop-pack-ko.webp", "bottom": "preview-shop-pack-ko-bottom.webp"}, {"id": "shop-pack", "label": "상점", "lang": "en", "src": "preview-shop-pack-en.webp", "bottom": "preview-shop-pack-en-bottom.webp"}, {"id": "training-staff", "label": "훈련소", "lang": "ko", "src": "preview-training-staff-ko.webp", "bottom": "preview-training-staff-ko-bottom.webp"}, {"id": "training-staff", "label": "훈련소", "lang": "en", "src": "preview-training-staff-en.webp", "bottom": "preview-training-staff-en-bottom.webp"}, {"id": "battle-selected", "label": "인게임", "lang": "ko", "src": "preview-battle-selected-ko.webp", "bottom": null}, {"id": "battle-selected", "label": "인게임", "lang": "en", "src": "preview-battle-selected-en.webp", "bottom": null}, {"id": "result-normal", "label": "종료·정산", "lang": "ko", "src": "preview-result-normal-ko.webp", "bottom": "preview-result-normal-ko-bottom.webp"}, {"id": "result-normal", "label": "종료·정산", "lang": "en", "src": "preview-result-normal-en.webp", "bottom": "preview-result-normal-en-bottom.webp"}];function render(){document.querySelector("main").replaceChildren(...data.filter(x=>x.lang===lang.value).map(x=>{const f=document.createElement("figure"),i=document.createElement("img"),c=document.createElement("figcaption");i.src=position.value==="bottom"&&x.bottom?x.bottom:x.src;i.loading="lazy";i.alt=x.label;c.textContent=x.label;f.append(i,c);return f}));}lang.onchange=position.onchange=render;render();</script></html>
