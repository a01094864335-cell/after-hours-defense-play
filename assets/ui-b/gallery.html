<!doctype html><html lang="ko"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공개 게임 B 애셋 갤러리</title><style>body{margin:24px;background:#21172f;color:#fff1d4;font:14px system-ui}a{color:#ffe198}.grid{display:flex;flex-wrap:wrap;gap:16px}figure{background:#30243b;margin:0;padding:12px;width:340px}figure img{max-width:100%;height:auto;image-rendering:pixelated}figcaption{font-size:12px;margin-top:10px}.preview{width:390px;max-width:100%}</style><h1>공개 게임 · B 에나멜 애셋</h1><p>after-hours-defense-play 기준. 메뉴·버튼·편성·3개 GNB의 기존 UX를 유지합니다.</p><p><a href="../../index.html">게임으로 돌아가기</a> · <a href="manifest.json">텍스트 영역·줄 수 manifest</a></p><p>아래는 GM 시각 검수 999,999코인 상태의 실제 로비 캡처입니다. 배포 상태·잔액과는 별개입니다.</p><img class="preview" src="applied-lobby.png" alt="공개 게임 UX에 B 애셋을 적용한 로비"><h2>29종 · 71개 상태</h2><main class="grid"></main><script>fetch('manifest.json').then(r=>r.json()).then(m=>{for(const a of m.assets){const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=a.png.split('/').pop();i.alt=a.id;c.textContent=a.id+' · 표시 '+a.size.join('×')+' · 텍스트 영역 '+a.safe.join(',')+' · '+(a.maxLines<=1?'두 줄 이상 불가':a.maxLines+'줄 이하');f.append(i,c);document.querySelector('main').append(f)}})</script></html>
