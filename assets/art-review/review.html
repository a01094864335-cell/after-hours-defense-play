<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>전체 아트 점검 · 2026-11-11</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7e4;color:#10254b;font:15px/1.6 system-ui}header,main{max-width:1300px;margin:auto;padding:24px}h1{font-size:28px;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select,input{font:inherit;padding:10px;border:0;border-radius:8px;background:white;color:inherit}button[aria-pressed=true]{background:#2258bb;color:white}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}article{background:white;padding:12px;border-radius:12px;min-width:0}h2{font-size:15px;overflow-wrap:anywhere}img{display:block;width:100%;height:340px;object-fit:contain;background:#eef2f7}article .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}article .pair img{height:300px}small{display:block;overflow-wrap:anywhere}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}a{color:#2258bb}#status{margin-bottom:20px}.story{grid-column:1/-1}.panels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:600px){.panels{grid-template-columns:repeat(2,1fr)}.panels img{height:310px}header,main{padding:16px}}@media(prefers-color-scheme:dark){body{background:#101d35;color:#fff5db}article,button,select,input{background:#203655;color:#fff5db}img{background:#14243e}}</style><header><h1>전체 아트 점검</h1><p>메인 그림체와 캐릭터 정체성을 기준으로 점검했습니다. 수정 전·후, 스토리 236장면, 배포 패키지에 포함된 이미지 목록입니다.</p><a href="../../">게임으로 돌아가기 →</a><nav><button data-view="edits" aria-pressed="true">수정 전·후</button><button data-view="stories">전체 스토리</button><button data-view="portraits">기준 초상화</button><button data-view="inventory">패키지 이미지</button></nav><small>‘패키지 포함’은 현재 게임에서 실제로 노출된다는 뜻이 아닙니다. 이전 시안·호환용 이미지도 포함되어 있습니다. 게임 기능과 수치는 유지했습니다.</small></header><main><div class="tools"><input id="search" aria-label="파일·에피소드 검색" placeholder="파일·에피소드 검색"><select id="group" aria-label="이미지 그룹"><option value="">모든 그룹</option></select></div><p id="status"></p><section id="items"></section></main><script>
const root=new URL('../../',location.href);let data,view='edits';const q=s=>document.querySelector(s),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),url=p=>new URL(p,root).href;function picture(p,label){return '<a href="'+safe(url(p))+'" target="_blank" rel="noopener"><img loading="lazy" decoding="async" src="'+safe(url(p))+'" alt="'+safe(label)+'"></a>'}function render(){const term=q('#search').value.toLowerCase(),group=q('#group').value;let rows=view==='edits'?data.edits:view==='stories'?data.stories:data.inventory.filter(r=>r.packaged&&(view!=='portraits'||r.group==='assets/character-portraits'));rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(term)&&(!group||r.group===group));q('#status').textContent=rows.length+'개 '+(view==='stories'?'에피소드 · 각 4장면':view==='edits'?'수정 이미지':'이미지');q('#items').innerHTML=rows.map(r=>{if(view==='edits')return '<article><h2>'+safe(r.path)+'</h2><div class="pair"><div><small>수정 전</small><a href="'+safe(r.before)+'"><img loading="lazy" src="'+safe(r.before)+'" alt="수정 전"></a></div><div><small>수정 후</small>'+picture(r.path,'수정 후')+'</div></div></article>';if(view==='stories')return '<article class="story"><h2>'+safe(r.kind+' / '+r.id)+'</h2><div class="panels">'+r.images.map((p,i)=>'<div>'+picture(p,r.id+' '+(i+1))+'<small>'+(i+1)+' / 4</small></div>').join('')+'</div></article>';return '<article><h2>'+safe(r.path)+'</h2>'+picture(r.path,r.path)+'<small>'+Math.round(r.bytes/1024)+' KB · '+r.width+' × '+r.height+'</small></article>'}).join('');q('#group').hidden=view!=='inventory'}fetch('data.json').then(r=>r.json()).then(d=>{data=d;for(const g of [...new Set(d.inventory.filter(r=>r.packaged).map(r=>r.group))].sort()){const o=document.createElement('option');o.value=g;o.textContent=g;q('#group').append(o)}render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;q('#group').value='';document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});q('#search').oninput=render;q('#group').onchange=render;
</script></html>
