<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마왕성 당직 UI · 실제 화면 비교</title><style>
:root{color-scheme:dark;font:14px/1.6 system-ui;color:#ecdfdf;background:#171020}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;padding:18px 24px;background:#24182ff5;border-bottom:1px solid #bc985e;backdrop-filter:blur(12px)}h1{font-size:24px;margin:0;color:#ffe2aa}p{margin:5px 0;color:#c4afca}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button,select,input{font:inherit;color:inherit;border:1px solid #9c7b6b;border-radius:7px;background:#3d2945;padding:8px 12px}button[aria-pressed=true]{background:#e1bc77;color:#352333}input{min-width:150px;flex:1;max-width:360px}main{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr));gap:28px}article{border:1px solid #8e6c6355;border-radius:12px;padding:16px;background:#281c33}h2{margin:0 0 12px;font-size:18px;color:#f4d5a0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}figcaption{font-size:12px;margin-bottom:8px;color:#bda5c4}img{display:block;width:100%;height:auto;border-radius:7px;border:1px solid #9a7c6f44}a{color:#d7e4c5}.single figure.before{display:none}.single .pair{grid-template-columns:1fr}.single img{max-width:430px;margin:auto}footer{padding:24px;text-align:center;color:#b19ab9}
</style><header><h1>마왕성 야간 당직 · 전체 UI 개편</h1><p>실제 게임에서 캡처한 35개 화면 · 기능과 데이터는 유지하고 화면 구성을 통일했습니다.</p><nav><select id="size" aria-label="화면 크기"><option value="390">390 × 844</option><option value="320">320 × 568</option><option value="430">430 × 932</option></select><button id="compare" aria-pressed="true">변경 전 / 후 비교</button><input id="search" type="search" placeholder="화면 이름으로 찾기" aria-label="화면 이름 검색"></nav></header><main></main><footer>장식 이미지 시안이 아닌 실제 게임 렌더링입니다. GM 테스트 저장으로 콘텐츠를 열어 캡처했으며 사용자 저장을 변경하지 않았습니다.</footer><script>const screens=[{"file": "01-lobby.webp", "label": "로비"}, {"file": "02-menu.webp", "label": "메뉴·설정"}, {"file": "03-records.webp", "label": "근무 기록"}, {"file": "04-training-staff.webp", "label": "직원 훈련"}, {"file": "05-roster-staff.webp", "label": "직원 도감"}, {"file": "06-shop-pack.webp", "label": "채용팩 상점"}, {"file": "07-story-archive.webp", "label": "이야기 목록"}, {"file": "08-daily-events.webp", "label": "오늘의 변주"}, {"file": "09-help.webp", "label": "도움말"}, {"file": "10-training-merc.webp", "label": "지원 훈련"}, {"file": "11-roster-merc.webp", "label": "지원 도감"}, {"file": "12-staff-detail.webp", "label": "직원 상세"}, {"file": "13-merc-detail.webp", "label": "지원 상세"}, {"file": "14-roster-locked.webp", "label": "미채용 도감"}, {"file": "15-locked-detail.webp", "label": "미채용 상세"}, {"file": "16-shop-items.webp", "label": "아이템 상점"}, {"file": "17-recruit-reveal.webp", "label": "채용 결과"}, {"file": "18-deck.webp", "label": "편성"}, {"file": "19-save-transfer.webp", "label": "저장 백업"}, {"file": "20-story-opening.webp", "label": "이야기 시작"}, {"file": "21-battle-preparation.webp", "label": "전투 준비"}, {"file": "22-equipment.webp", "label": "장비"}, {"file": "23-battle-running.webp", "label": "전투 진행"}, {"file": "24-pause.webp", "label": "일시정지"}, {"file": "25-leave.webp", "label": "중도 종료"}, {"file": "26-guide.webp", "label": "연수 안내"}, {"file": "27-bonus.webp", "label": "정비 보너스"}, {"file": "28-bonus-target.webp", "label": "보너스 대상"}, {"file": "29-boss-warning.webp", "label": "군단장 예고"}, {"file": "30-story-daily.webp", "label": "성 이야기"}, {"file": "31-story-opening-last.webp", "label": "이야기 마지막"}, {"file": "32-result.webp", "label": "게임 종료"}, {"file": "33-starter-choice.webp", "label": "수료 선물 · 직원 선택"}, {"file": "34-staff-trial.webp", "label": "직원 능력 체험"}, {"file": "35-hiring-story.webp", "label": "입사 이야기"}];const main=document.querySelector('main'),size=document.querySelector('#size'),search=document.querySelector('#search');function render(){main.replaceChildren();for(const s of screens.filter(s=>s.label.includes(search.value))){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=s.label;a.append(h);const pair=document.createElement('div');pair.className='pair';for(const phase of ['before','after']){const f=document.createElement('figure');f.className=phase;const c=document.createElement('figcaption');c.textContent=phase==='before'?'변경 전':'개편 후';const link=document.createElement('a');link.href=phase+'/'+size.value+'/'+s.file;link.target='_blank';const img=document.createElement('img');img.src=link.href;img.alt=s.label+' '+c.textContent;img.loading='lazy';link.append(img);f.append(c,link);pair.append(f)}a.append(pair);main.append(a)}}size.onchange=render;search.oninput=render;document.querySelector('#compare').onclick=e=>{const pressed=e.target.getAttribute('aria-pressed')==='true';e.target.setAttribute('aria-pressed',String(!pressed));main.classList.toggle('single',pressed)};render();</script></html>
