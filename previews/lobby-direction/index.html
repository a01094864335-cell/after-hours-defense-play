<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>로비 개선 시안 · 실제 HTML</title>
    <link rel="stylesheet" href="lobby.css" />
  </head>
  <body>
    <main class="lobby" aria-label="로비 디자인 시안">
      <section class="scene" aria-label="마왕성 당직실">
        <header class="hud">
          <div class="profile">
            <span class="profile-emblem"
              ><img src="../../assets/ui-v2/icons/shield.svg" alt=""
            /></span>
            <div><strong>신입 고비</strong><small>변주 · 화력 지원</small></div>
          </div>
          <div class="wallet">
            <img src="../../assets/ui-v2/icons/coin.svg" alt="코인" /><b>144</b>
          </div>
          <button class="settings" aria-label="설정">
            <img src="../../assets/ui-v2/icons/gear.svg" alt="" />
          </button>
        </header>
        <img
          class="game-logo"
          src="../../assets/reference-ui/title-logo.svg"
          alt="마왕이 퇴근한 뒤"
        />
        <div class="hero">
          <span class="ground-shadow"></span
          ><img
            src="../../assets/mobile/lobby-gobi.webp"
            alt="당직을 준비하는 고비"
          />
        </div>
        <nav class="shortcuts" aria-label="당직실 바로가기">
          <button>
            <img src="../../assets/ui-v2/icons/book.svg" alt="" /><span
              >이야기</span
            >
          </button>
          <button>
            <img src="../../assets/ui-v2/icons/scroll.svg" alt="" /><span
              >기록</span
            >
          </button>
          <button>
            <img src="../../assets/ui-v2/icons/sword.svg" alt="" /><span
              >훈련소</span
            >
          </button>
        </nav>
        <button class="support">
          <img src="../../assets/ui-v2/icons/plus.svg" alt="" /><span
            >지원 영웅</span
          ><small>선택하기</small>
        </button>
      </section>
      <section class="duty-board" aria-label="오늘의 근무 준비">
        <button class="daily">
          <img src="../../assets/ui-v2/icons/moon.svg" alt="" /><span
            >오늘의 변주</span
          ><strong>화력 지원</strong
          ><img
            class="chevron"
            src="../../assets/ui-v2/icons/arrow-right.svg"
            alt=""
          />
        </button>
        <button
          class="party"
          aria-label="오늘의 근무 직원 · 5명 편성 · 공격 3 지원 2"
        >
          <span class="party-heading"
            ><strong>오늘의 근무 직원</strong
            ><small><b>5/5</b><i></i>공격 3 · 지원 2</small></span
          >
          <span class="staff-grid">
            <span class="staff" style="--accent: #c4ad73"
              ><span class="portrait"
                ><img src="../../assets/pixel/goblin-guard.webp" alt="" /></span
              ><span>브릭</span></span
            >
            <span class="staff" style="--accent: #ba8172"
              ><span class="portrait"
                ><img
                  src="../../assets/pixel/orc-technician.webp"
                  alt="" /></span
              ><span>토르크</span></span
            >
            <span class="staff" style="--accent: #70b6b6"
              ><span class="portrait"
                ><img
                  src="../../assets/pixel/slime-cleaner.webp"
                  alt="" /></span
              ><span>뽀득</span></span
            >
            <span class="staff" style="--accent: #94ab78"
              ><span class="portrait"
                ><img src="../../assets/pixel/gobi.webp" alt="" /></span
              ><span>고비</span></span
            >
            <span class="staff" style="--accent: #d5b95f"
              ><span class="portrait"
                ><img
                  src="../../assets/pixel/electric-technician.webp"
                  alt="" /></span
              ><span>찌릿</span></span
            >
          </span>
        </button>
        <div class="assignment">
          <img src="../../assets/ui-v2/icons/shield.svg" alt="" /><span
            >오늘의 근무</span
          ><strong>마왕성 야간 방어</strong>
        </div>
        <button class="prepare">
          <img src="../../assets/ui-v2/icons/sword.svg" alt="" /><span
            >당직 준비</span
          ><img src="../../assets/ui-v2/icons/arrow-right.svg" alt="" />
        </button>
      </section>
      <nav class="gnb" aria-label="주요 메뉴">
        <button>
          <img src="../../assets/ui-v2/icons/scroll.svg" alt="" /><span
            >직원 도감</span
          >
        </button>
        <button aria-current="page">
          <img src="../../assets/ui-v2/icons/home.svg" alt="" /><span
            >당직실</span
          ><i></i>
        </button>
        <button>
          <img src="../../assets/ui-v2/icons/shop.svg" alt="" /><span
            >상점</span
          >
        </button>
      </nav>
    </main>
  </body>
</html>
